# ==============================================================================
# SEASTAR MAX-PERFORMANCE CONFIGURATION
# ==============================================================================

# --- Execution Framework & Core Binding ---
thread-affinity=1                    # Pin engine threads to dedicated CPU cores

# --- Memory Management ---
reserve-memory=4G                    # Reserve memory headroom
mbind=1                              # NUMA node affinity binding
abort-on-seastar-bad-alloc=1         # Immediate crash on allocation failure
dump-memory-diagnostics-on-alloc-failure-kind=critical

# --- Reactor Backend & Event Loop ---
reactor-backend=io_uring             # Linux io_uring async I/O engine
idle-poll-time-us=2500               # Busy-poll up to 2.5ms before sleeping (drops tail latency)
poll-aio=1                           # Busy-poll disk I/O completions
task-quota-ms=0.5                    # Max time (ms) between reactor polls
linux-aio-nowait=1                   # Non-blocking kernel AIO submissions
force-aio-syscalls=0                 # Avoid unnecessary kernel syscall traps
aio-fsync=1                          # Asynchronous fsync calls

# --- Networking ---
dhcp=0                               # Disable DHCP client daemon

# --- Concurrency & System Tweaks ---
enable-glibc-exception-scaling-workaround=1  # Scalable multi-core C++ exceptions
allow-cpus-in-remote-numa-nodes=1            # Balance cores across NUMA nodes

# --- Logging & Diagnostics ---
default-log-level=info              # Suppress info/debug I/O overhead on hot path
log-to-syslog=0                      # Disable syslog IPC overhead
blocked-reactor-notify-ms=25         # Stall detector threshold
blocked-reactor-reports-per-minute=5
blocked-reactor-report-format-oneline=1
